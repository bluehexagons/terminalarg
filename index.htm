<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#050505">
		<link rel="icon" href="t.png" type="image/png">
		<title>terminalarg — a tiny mock terminal</title>
		<style>
			@font-face {
				font-family: Terminus;
				src: local("Terminus"),
					url(Terminus.ttf) format("truetype");
				font-display: swap;
			}
			@font-face {
				font-family: Terminus;
				src: local("Terminus"),
					url(TerminusBold.ttf) format("truetype");
				font-weight: bold;
				font-display: swap;
			}

			*, *::before, *::after {
				box-sizing: border-box;
			}

			html {
				min-height: 100%;
				background: #050505;
				color-scheme: dark;
			}

			body {
				min-height: 100vh;
				min-height: 100dvh;
				margin: 0;
				padding: clamp(8px, 2vw, 20px);
				background: radial-gradient(circle at top, #10141b 0, #050505 45rem);
			}

			#terminal {
				min-height: calc(100vh - clamp(16px, 4vw, 40px));
				min-height: calc(100dvh - clamp(16px, 4vw, 40px));
				max-width: 1200px;
				margin: 0 auto;
				font-family: Terminus, "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
				width: 100%;
				background: rgba(0, 0, 0, 0.82);
				color: #f3f6ff;
				position: relative;
				border: 1px solid #26303d;
				border-radius: 8px;
				box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
				padding: clamp(10px, 2vw, 18px);
				overflow: auto;
				overscroll-behavior: contain;
				cursor: text;
			}

			#terminal pre {
				display: block;
				width: 100%;
				min-height: 100%;
				margin: 0;
				padding: 0;
				font: inherit;
				font-size: clamp(15px, 1.6vw, 18px);
				line-height: 1.3;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				tab-size: 4;
			}

			#terminal ::selection {
				background: white;
				color: black;
			}

			.terminal-input {
				position: fixed;
				left: 0;
				bottom: 0;
				width: 1px;
				height: 1px;
				padding: 0;
				border: 0;
				opacity: 0.01;
				resize: none;
				pointer-events: none;
			}

			#terminal a {
				color: #8bd5ff;
				text-decoration: underline;
				text-underline-offset: 0.15em;
			}
			#terminal a * {
				text-decoration: underline;
			}
			#terminal a:hover,
			#terminal a:focus-visible {
				color: #d8f3ff;
			}

			#terminal img {
				cursor: default;
			}

			#terminal img.embedded {
				display: block;
				max-width: 100%;
				height: auto;
				padding: 6px 0;
			}

			.terminal-cursor {
				background: white;
				color: black;
				animation: blink 1.1s steps(1, end) infinite;
			}

			#terminal:focus-within {
				border-color: #52657a;
			}

			@keyframes blink {
				50% { background: transparent; color: inherit; }
			}

			@media (prefers-reduced-motion: reduce) {
				.terminal-cursor { animation: none; }
			}
		</style>
	</head>
	<body>
		<pre id="greeting" data-indent="3" hidden>
			*terminalarg* — a tiny browser-based mock terminal
			Type [help](##help) for commands, keyboard shortcuts, and things to try.
		</pre>
		<pre id="startup" hidden>
			wget thumbs/foodguide.png
			wget scores.js
			wait
			img foodguide.png
			chmod +x scores.js
		</pre>
		<main id="terminal" aria-label="Interactive mock terminal"></main>

				terminal.echo('chmod: cannot change permissions of `' + args[2] + '\': No such file or directory');
			}
		}));
		fs.add('/bin', 'history', new Filesystem.Executable(function (global) {
			var terminal = global.terminal,
				history = terminal.history,
				i,
				l = history.length,
				chrs = (l / 10 | 0) + 2;
			for (i = 0; i < l; i++) {
				terminal.echo(Array(chrs - (i / 10 | 0)).join(' ') + (i + 1) + '  ' + history[i]);
			}
		}));
		fs.add('/bin', 'img', new Filesystem.Executable(function (global) {
			var terminal = global.terminal,
				args = global.args,
				line = document.createElement('div'),
				img,
				file;
			if (!args[1]) {
				missingOperand(terminal, 'img', 'img <file>');
				return;
			}
			file = global.filesystem.get(args[1], global.path, global.home);
			terminal.echo('', line);
			if (file instanceof Filesystem.File && file.binaryContent !== null) {
				line.removeChild(line.firstChild);
				img = new Image();
				img.className = 'embedded';
				img.alt = args[1];
				img.onload = function (e) {
					URL.revokeObjectURL(e.target.src);
					terminal.elements.inputLine.scrollIntoView({block: 'nearest'});
				};
				img.onerror = function (e) {
					URL.revokeObjectURL(e.target.src);
					line.textContent = 'img: could not decode image';
				};
				img.src = URL.createObjectURL(file.binaryContent);
				line.appendChild(img);
			} else {
				line.firstChild.textContent = 'img: could not render image';
			}
		}));
		fs.add('/bin', 'wget', new Filesystem.Executable(function (global) {
			var terminal = global.terminal,
				args = global.args,
				dir = global.filesystem.get(global.path),
				xhr = new XMLHttpRequest(),
				line = document.createElement('div'),
				href = args[1],
				filename,
				finished = false,
				finishAsync = function () {
					if (!finished && !isNaN(global.async)) {
						finished = true;
						global.async--;
						terminal.event.resume && terminal.event.resume();
					}
				},
				fail = function (message) {
					line.textContent = 'wget: ' + message;
					finishAsync();
				};
			if (!href) {
				missingOperand(terminal, 'wget', 'wget <url>');
				return;
			}
			filename = href.substring(href.lastIndexOf('/') + 1).split(/[?#]/)[0] || 'index.html';
			if (filename === '.' || filename === '..') {
				filename = 'index.html';
			}
			if (!owns(dir.map, filename)) {
				terminal.print('getting ' + filename + ' *{black,white  }{gray          }* *0*/0* *', line);
				line.childNodes[1].firstChild.textContent = '';
				if (!isNaN(global.async)) {
					global.async++;
				}
				xhr.addEventListener('progress', function (e) {
					var progress = e.lengthComputable && e.total ? e.loaded / e.total * 10 | 0 : 0;
					line.childNodes[1].firstChild.textContent = '__________'.substring(10 - progress);
					line.childNodes[2].firstChild.textContent = '..........'.substring(progress);
					line.childNodes[4].firstChild.textContent = e.loaded;
					line.childNodes[5].firstChild.textContent = e.lengthComputable ? '/' + e.total : '';
				}, false);
				xhr.addEventListener('load', function (e) {
					var progress = 10,
						size;
					if (xhr.status < 200 || xhr.status >= 300) {
						fail(filename + ': request failed (' + xhr.status + ')');
						return;
					}
					size = e.target.response.size;
					line.childNodes[1].firstChild.textContent = '__________'.substring(10 - progress);
					line.childNodes[2].firstChild.textContent = '..........'.substring(progress);
					line.childNodes[4].firstChild.textContent = size;
					line.childNodes[5].firstChild.textContent = '/' + size;
					dir.map[filename] = new Filesystem.File(e.target.response, {location: href}, global);
					line.childNodes[6].firstChild.textContent = '  DONE';
					finishAsync();
				}, false);
				xhr.addEventListener('error', function () {
					fail(filename + ': network error');
				}, false);
				xhr.addEventListener('abort', function () {
					fail(filename + ': request aborted');
				}, false);
				xhr.addEventListener('timeout', function () {
					fail(filename + ': request timed out');
				}, false);
				xhr.open('GET', href);
				xhr.responseType = 'blob';
				xhr.timeout = 15000;
				xhr.send();
			} else {
				terminal.echo('wget: ' + filename + ': File already exists');
			}
		}));
		fs.add('/bin', 'testinput', new Filesystem.Executable(function (global) {
			var terminal = global.terminal,
				input = global.input || 'enter something:';
			terminal.getInput(function (value) {
				terminal.print(value);
			}, input + ' ');
		}));
		fs.add('/bin', 'more', new Filesystem.Executable(function (global) {
			var terminal = global.terminal,
				args = global.args,
				file,
				filename,
				lines,
				line = 0,
				len,
				linesPerScreen,
				formatted = false,
				echoScreen = function () {
					var i,
						l = Math.min(len, line + linesPerScreen);
					for (i = line; i < l; i++) {
						if (!formatted) {
							terminal.echo(lines[i]);
						} else {
							terminal.print(lines[i]);
						}
					}
				};

			if (args[1] === '-f') {
				filename = args[2];
				formatted = true;
			} else {
				filename = args[1];
			}
			if (!filename) {
				missingOperand(terminal, 'more', 'more [-f] <file>');
				return;
			}
			file = global.filesystem.get(filename, global.path, global.home);

			if (file !== null) {
				if (file instanceof Filesystem.File) {
					if (file instanceof Filesystem.Executable) {
						lines = file.getSource().replace(/\t/g, '    ').split('\n');
					} else {
						lines = file.textContent.replace(/\t/g, '    ').split('\n');
					}
					len = lines.length;
					linesPerScreen = Math.max(1,
						(window.innerHeight / terminal.elements.inputLine.offsetHeight | 0) - 3);
					echoScreen();
					if (len > linesPerScreen) {
						terminal.hideInput();
						terminal.echo('-- more (Enter: next line, q: quit) --');
						terminal.pushEvent({
							getPrefix: function () { return ''; },
							oninput: function (terminal, text) {
								if (text.toLowerCase().indexOf('q') !== -1) {
									terminal.popEvent();
									terminal.showInput();
								}
							},
							onkeydown: function (terminal, keyCode, modifiers, e) {
								if (keyCode === keyCodes.enter) {
									e.preventDefault();
									line++;
									if (!formatted) {
										terminal.echo(lines[line + linesPerScreen - 1] || '');
									} else {
										terminal.print(lines[line + linesPerScreen - 1] || '');
									}
									if (line + linesPerScreen >= len) {
										terminal.popEvent();
										terminal.showInput();
									}
								} else if (e.key && e.key.toLowerCase() === 'q') {
									e.preventDefault();
									terminal.popEvent();
									terminal.showInput();
								}
							}
						});
					}
				} else {
					terminal.echo('more: ' + filename + ': Is a directory');
				}
			} else {
				terminal.echo('more: ' + filename + ': No such file or directory');
			}
		}));
		fs.add('/bin', 'pwd', new Filesystem.Executable(function (global) {
			global.terminal.echo(global.filesystem.getPath(global.path));
		}));
		fs.add('/bin', 'clear', new Filesystem.Executable(function (global) {
			global.terminal.clear();
		}));
		fs.add('/bin', 'echo', new Filesystem.Executable(function (global) {
			global.terminal.echo(global.args.slice(1).join(' '));
		}));
		fs.add('/bin', 'print', new Filesystem.Executable(function (global) {
			global.terminal.print(global.input);
		}));
		fs.add('/bin', 'set', new Filesystem.Executable(function (global) {
			if (global.args[1]) {
				global[global.args[1]] = global.args.slice(2).join(' ');
			} else {
				missingOperand(global.terminal, 'set', 'set <name> <value>');
			}
		}));
		fs.add('/bin', 'setenv', new Filesystem.Executable(function (global) {
			if (global.args[1]) {
				global.terminal.env[global.args[1]] = global.args.slice(2).join(' ');
			} else {
				missingOperand(global.terminal, 'setenv', 'setenv <name> <value>');
			}
		}));
		fs.add('/bin', 'help', new Filesystem.Executable(function (global) {
			var terminal = global.terminal,
				name = global.args[1],
				doc,
				categories,
				i,
				j,
				command;
			if (name) {
				doc = commandDocs[name];
				if (!doc) {
					terminal.echo('help: no help topic for ' + name);
					terminal.echo('Type help to see every command.');
					return;
				}
				terminal.print('*' + name + '*');
				terminal.echo('usage: ' + doc[0]);
				terminal.echo(doc[1]);
				terminal.print('example: [' + escapeTerminalFormatting(doc[2]) + '](##' + doc[2] + ')');
				return;
			}

			terminal.print('*terminalarg help*');
			terminal.echo('This is a playful, in-memory shell. Files you create or download reset when the page reloads.');
			terminal.echo('');
			terminal.print('*Things to try*');
			terminal.print('  [ls](##ls)                         explore your home folder');
			terminal.print('  [img foodguide.png](##img foodguide.png)          show the downloaded sample image');
			terminal.print('  [./scores.js](##./scores.js)                launch the interactive score app (then type help)');
			terminal.print('  [mkdir sandbox](##mkdir sandbox)              create a folder to experiment in');
			terminal.print('  [setenv mood curious](##setenv mood curious)       set a variable, then try echo %%%mood%');
			terminal.echo('');
			terminal.print('*Available commands*');
			categories = [
				['Explore', ['help', 'ls', 'dir', 'cd', 'pwd', 'history', 'clear']],
				['Files', ['cat', 'more', 'mkdir', 'rmdir', 'touch', 'rm']],
				['Download & run', ['wget', 'img', 'chmod']],
				['Text & scripts', ['echo', 'print', 'set', 'setenv', 'testinput']]
			];
			for (i = 0; i < categories.length; i++) {
				terminal.echo('  ' + categories[i][0] + ':');
				for (j = 0; j < categories[i][1].length; j++) {
					command = categories[i][1][j];
					doc = commandDocs[command];
					terminal.print('    [' + command + '](##help ' + command + ')' +
						Array(Math.max(2, 12 - command.length)).join(' ') +
						escapeTerminalFormatting(doc[1]));
				}
			}
			terminal.echo('');
			terminal.echo('Keyboard: Tab completes names; Up/Down browse history; arrows, Home, End, Backspace, and Delete edit the command.');
			terminal.echo('Ctrl/Command+Backspace deletes a word. Touch keyboards, paste, and composed text are supported.');
			terminal.echo('Tip: click any blue example to run it. Type help <command> for usage.');
		}));
		fs.add('/', 'test1', new Filesystem.File('testing one two\ntesting one two three'));
		fs.add('/', 'test2', new Filesystem.File('testing eight two\nfivetest one two three\ncow eats radish'));
		window.fs = fs;

		(function () {
			var terminal = new Terminal(document.getElementById('terminal'), fs, {
					home: '/home'
				}),
				greeting = document.getElementById('greeting'),
				startup = document.getElementById('startup'),
				lines = greeting.firstChild.textContent.split('\n'),
				indent = (greeting.dataset ? greeting.dataset.indent : greeting['data-indent']) | 0,
				i,
				l = lines.length - 1;
			greeting.style.display = 'none';
			for (i = 0; i < l; i++) {
				terminal.print(lines[i].substring(indent));
			}
			startup.style.display = 'none';
			fs.add(terminal.home, 'startup', new Filesystem.Executable(startup.firstChild.textContent));
			terminal.runCommand('/home/startup');
			window.terminal = terminal;
		}());
	}());
</script>
	</body>
